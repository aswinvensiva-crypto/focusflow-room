<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Supabase Browser Demo</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h1>Supabase Data Viewer</h1>

  <button id="btnFetchRooms">Fetch Rooms</button>
  <button id="btnFetchCustomers">Fetch Customers</button>
  <button id="btnFetchBookings">Fetch Bookings</button>

  <pre id="output"></pre>

  <script>
    // 1) Paste your Supabase credentials here
    const SUPABASE_URL = "https://delkooaxroutckwvxfbe.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlbGtvb2F4cm91dGNrd3Z4ZmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1ODcxNzMsImV4cCI6MjA3NjE2MzE3M30.3upU-B8uVds1N3N0dl_EoZgo0SYyq3hxeRwGCDZWpho";

    // 2) Create the Supabase client
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Output area
    const output = document.getElementById("output");

    // Helper to print results
    function showResult(label, data) {
      output.innerText = `${label}:\n\n` + JSON.stringify(data, null, 2);
    }

    // Fetch Rooms
    document.getElementById("btnFetchRooms")
      .addEventListener("click", async () => {
        const { data, error } = await supabase
          .from("rooms")
          .select("*");

        if (error) {
          showResult("Rooms Error", error.message);
        } else {
          showResult("Rooms Data", data);
        }
      });

    // Fetch Customers
    document.getElementById("btnFetchCustomers")
      .addEventListener("click", async () => {
        const { data, error } = await supabase
          .from("customers")
          .select("*");

        if (error) {
          showResult("Customers Error", error.message);
        } else {
          showResult("Customers Data", data);
        }
      });

    // Fetch Bookings
    document.getElementById("btnFetchBookings")
      .addEventListener("click", async () => {
        const { data, error } = await supabase
          .from("bookings")
          .select("*");

        if (error) {
          showResult("Bookings Error", error.message);
        } else {
          showResult("Bookings Data", data);
        }
      });
  </script>
</body>
</html>
